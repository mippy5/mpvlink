[package]
name = "mpvlink"
description = "mpv plugin: join low-latency WebRTC rooms"
version.workspace = true
edition.workspace = true

[lib]
# Build a C-ABI shared library (.dylib / .so / .dll) that mpv can load as a cplugin.
crate-type = ["cdylib"]

[dependencies]
mpvlink-proto.workspace = true
mpvlink-rtc.workspace = true
anyhow.workspace = true
bytes.workspace = true
tokio.workspace = true
